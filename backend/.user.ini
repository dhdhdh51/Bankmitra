; =====================================================================
; LRMS - PHP runtime settings for cPanel (PHP-FPM / CGI)
; ---------------------------------------------------------------------
; On most cPanel hosts PHP does NOT run as an Apache module, so php_value
; lines in .htaccess are ignored. A .user.ini file in the document root IS
; honoured (it is the per-directory INI mechanism for CGI/FPM).
;
; Changes can take up to 5 minutes to apply (user_ini.cache_ttl), or restart
; PHP from cPanel if your host exposes that.
;
; If your host forbids .user.ini, set the same values in
; cPanel > MultiPHP INI Editor > (your domain) > Editor mode.
; =====================================================================

; --- Uploads: a 12 MP phone photo can be 6-8 MB, and a visit may carry
;     several photos, so allow headroom.
upload_max_filesize = 24M
post_max_size = 32M
max_file_uploads = 25

; --- The Excel allocation import of tens of thousands of rows needs time
;     and memory. Reduce these if your host complains.
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; --- Sessions: 30 minutes of idle time, matching the application's own
;     auto-logout setting (Settings > Security).
session.gc_maxlifetime = 1800
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; --- Errors are logged to storage/logs, never shown to visitors.
display_errors = Off
display_startup_errors = Off
log_errors = On

; --- Timezone (also set in config/config.php)
date.timezone = Asia/Kolkata

; --- Keep the PHP version out of response headers.
expose_php = Off
