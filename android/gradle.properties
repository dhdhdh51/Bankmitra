# =====================================================================
# LRMS Android - Gradle properties
# =====================================================================

# 2 GB is enough for this project and stays inside the memory limits of
# free GitHub Actions runners.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Build cache and parallel execution keep CI runs short.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# AndroidX only; the old support library is long gone.
android.useAndroidX=true

# Do not upload build scans or usage statistics from CI.
org.gradle.welcome=never
